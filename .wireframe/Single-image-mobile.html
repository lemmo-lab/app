<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-image Mobile Wireframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Single-image */
        .single-image {
            position: relative;
            width: 393px;
            height: 1289px;
            background: #0A0A0A;
            overflow: hidden;
        }

        /* main */
        .main {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 0px;
            isolation: isolate;
            position: absolute;
            width: 393px;
            height: 1080px;
            left: 0px;
            top: 0px;
        }

        /* body */
        .body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px;
            gap: 16px;
            width: 393px;
            height: 1080px;
            background: #0A0A0A;
            flex: none;
            order: 0;
            flex-grow: 1;
            z-index: 0;
        }

        /* back-button */
        .back-button {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 361px;
            height: 32px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        .rect-11 {
            width: 32px;
            height: 32px;
            background: #D9D9D9;
            border-radius: 6px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        /* content */
        .content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            gap: 48px;
            width: 361px;
            height: 606px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        /* little-gallery (Hidden in mobile) */
        .little-gallery {
            display: none;
            width: 64px;
            height: 904px;
        }

        /* content-area */
        .content-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 361px;
            height: 606.22px;
            background: #111111;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .rect-17 {
            width: 361px;
            height: 606.22px;
            background: #D9D9D9;
            border-radius: 2px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        /* details-content */
        .details-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            gap: 16px;
            width: 361px;
            height: 542px;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 0;
        }

        /* promp */
        .promp {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            gap: 16px;
            width: 361px;
            height: 486px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        /* top_section */
        .top_section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0px;
            gap: 151px;
            width: 361px;
            height: 18px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        .quick-action {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 44px;
            height: 18px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        .copy-button, .share-button {
            width: 18px;
            height: 18px;
            background: #D9D9D9;
            border-radius: 4px;
            flex: none;
            flex-grow: 0;
        }

        .top_section .lable {
            width: 89px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        /* promp_card */
        .promp_card {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px;
            gap: 10px;
            width: 361px;
            height: 206px;
            background: #272525;
            border-radius: 16px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .promp_card .text {
            width: 329px;
            height: 12px;
            background: #484848;
            border-radius: 99px;
            flex: none;
            align-self: stretch;
            flex-grow: 0;
        }

        .promp_card .text.short {
            width: 92px;
            align-self: flex-start;
        }

        /* tag */
        .tag {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 361px;
            height: 28px;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 0;
        }

        .tag-box {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 106px;
            height: 28px;
            flex: none;
            flex-grow: 0;
        }

        .tag_ {
            width: 106px;
            height: 28px;
            background: #464646;
            border-radius: 4px;
            flex: none;
            align-self: stretch;
            flex-grow: 1;
        }

        /* refrance */
        .refrance {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            gap: 10px;
            width: 361px;
            height: 70px;
            flex: none;
            order: 3;
            align-self: stretch;
            flex-grow: 0;
        }

        .refrance .lable {
            width: 65px;
            height: 12px;
            background: #424242;
            border-radius: 99px;
            flex: none;
            align-self: stretch;
            flex-grow: 0;
        }

        .refrances {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 361px;
            height: 48px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .ref-item {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 48px;
            height: 48px;
            flex: none;
            flex-grow: 0;
        }

        .refrance-image {
            width: 48px;
            height: 48px;
            background: #464646;
            border-radius: 8px;
            flex: none;
            flex-grow: 0;
        }

        /* action_base */
        .action_base {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 9px;
            width: 361px;
            height: 40px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .regreat-button {
            width: 361px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 999px;
            flex: none;
            order: 0;
            flex-grow: 1;
        }

        /* side (Hidden in mobile by default) */
        .side {
            display: none;
            position: absolute;
            width: 171px;
            height: 852px;
            right: 0px;
            top: 0px;
            background: #131517;
            padding: 8px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="single-image">
        <div class="main">
            <div class="body">
                
                <!-- back-button -->
                <div class="back-button">
                    <div class="rect-11"></div>
                </div>

                <!-- content -->
                <div class="content">
                    <!-- content-area -->
                    <div class="content-area">
                        <div class="rect-17"></div>
                    </div>
                </div>

                <!-- details-content -->
                <div class="details-content">
                    <!-- promp -->
                    <div class="promp">
                        <div class="top_section">
                            <div class="quick-action">
                                <div class="copy-button"></div>
                                <div class="share-button"></div>
                            </div>
                            <div class="lable"></div>
                        </div>

                        <div class="promp_card">
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text short"></div>
                        </div>

                        <div class="tag">
                            <div class="tag-box"><div class="tag_"></div></div>
                            <div class="tag-box"><div class="tag_"></div></div>
                        </div>

                        <div class="refrance">
                            <div class="lable"></div>
                            <div class="refrances">
                                <div class="ref-item"><div class="refrance-image"></div></div>
                                <div class="ref-item"><div class="refrance-image"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- action_base -->
                    <div class="action_base">
                        <div class="regreat-button"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- side menu (Hidden) -->
        <div class="side"></div>
    </div>

</body>
</html>
