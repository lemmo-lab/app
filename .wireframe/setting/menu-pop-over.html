<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting-index Interactive Popover</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Setting-index */
        .setting-index {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0A0A0A;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            overflow: hidden;
        }

        /* main */
        .main {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 0px;
            position: absolute;
            width: 1920px;
            height: 1080px;
            left: 0px;
            top: 0px;
        }

        /* body */
        .body {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            width: 1848px;
            height: 1080px;
            background: #0A0A0A;
            flex: none;
            order: 0;
            flex-grow: 1;
        }

        /* canvas */
        .canvas {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 0px;
            width: 1848px;
            height: 1080px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 1;
        }

        /* side */
        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            width: 72px;
            height: 1080px;
            background: #131517;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
            position: relative;
        }

        .side .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 56px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .side .button .icon {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 40px;
            height: 40px;
        }

        .side .button .rect-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .primary-cats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 272px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 60px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .nav-button.active {
            background: #453D3D;
        }

        .nav-button .icon-small {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 20px;
            height: 20px;
        }

        .nav-button .rect-8-small {
            width: 20px;
            height: 20px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .nav-button .rect-9-indicator {
            width: 40px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .tools-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            width: 56px;
            height: 60px;
        }

        .footer-sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 676px;
            flex-grow: 1;
            position: relative;
        }

        .footer-sidebar .nav-button {
            margin-bottom: 8px;
        }

        /* button-setting+profile (Interactive Trigger) */
        .button-setting-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 56px;
            background: #171717;
            border-radius: 8px;
            cursor: pointer;
            flex: none;
            order: 1;
            flex-grow: 0;
        }

        .button-setting-profile .icon {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            isolation: isolate;
            width: 40px;
            height: 40px;
        }

        .button-setting-profile .rect-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
            z-index: 0;
        }

        /* popover (Interactive Menu) */
        .popover {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: flex-start;
            padding: 16px 8px;
            position: absolute;
            width: 265px;
            height: 348px;
            right: 64px;
            bottom: 16px; /* Aligned smoothly with footer profile button */
            background: #555555;
            border-radius: 12px;
            z-index: 10;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.4);
        }

        .popover.active {
            display: flex;
        }

        /* plan-review */
        .plan-review {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 8px 8px 16px;
            gap: 8px;
            width: 249px;
            height: 60px;
            border-radius: 8px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        .plan-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 0px;
            gap: 10px;
            width: 90px;
            height: 36px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        .rect-66 {
            width: 90px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        .rect-67 {
            width: 55px;
            height: 12px;
            background: #7C7C7C;
            border-radius: 99px;
            flex: none;
            order: 1;
            flex-grow: 0;
        }

        .progress {
            width: 36px;
            height: 36px;
            background: #D9D9D9;
            border-radius: 6px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        /* quick-action */
        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px 0px 16px;
            width: 249px;
            height: 216px;
            flex: none;
            order: 1;
            flex-grow: 0;
        }

        .action-btn-item {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 8px;
            gap: 8px;
            width: 249px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.2s;
        }

        .action-btn-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn-item.upgrade {
            background: #272727;
        }

        .action-btn-item .rect-66 {
            width: 90px;
            height: 14px;
            background: #D9D9D9;
        }

        .action-btn-item .rect-65 {
            width: 24px;
            height: 24px;
            background: #D9D9D9;
            border-radius: 6px;
        }

        /* Log-out-button */
        .Log-out-button {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 8px;
            gap: 8px;
            width: 249px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 0;
            transition: background 0.2s;
        }

        .Log-out-button:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        .Log-out-button .rect-66 {
            width: 90px;
            height: 14px;
            background: #D9D9D9;
        }

        .Log-out-button .rect-65 {
            width: 24px;
            height: 24px;
            background: #D9D9D9;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="setting-index">
        <div class="main">
            <!-- body -->
            <div class="body">
                <!-- canvas -->
                <div class="canvas"></div>
            </div>
        </div>

        <!-- side -->
        <div class="side">
            <div class="button">
                <div class="icon"><div class="rect-8"></div></div>
            </div>
            
            <div class="primary-cats">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="tools-section">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="footer-sidebar">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                
                <!-- button-setting+profile (Interactive Toggle Trigger) -->
                <div class="button-setting-profile" id="profileToggle">
                    <div class="icon">
                        <div class="rect-8"></div>
                    </div>
                </div>

                <!-- popover (Interactive Menu) -->
                <div class="popover" id="settingPopover">
                    <div class="plan-review">
                        <div class="plan-details">
                            <div class="rect-66"></div>
                            <div class="rect-67"></div>
                        </div>
                        <div class="progress"></div>
                    </div>

                    <div class="quick-action">
                        <div class="action-btn-item upgrade">
                            <div class="rect-66"></div>
                            <div class="rect-65"></div>
                        </div>
                        <div class="action-btn-item">
                            <div class="rect-66"></div>
                            <div class="rect-65"></div>
                        </div>
                        <div class="action-btn-item">
                            <div class="rect-66"></div>
                            <div class="rect-65"></div>
                        </div>
                        <div class="action-btn-item">
                            <div class="rect-66"></div>
                            <div class="rect-65"></div>
                        </div>
                        <div class="action-btn-item">
                            <div class="rect-66"></div>
                            <div class="rect-65"></div>
                        </div>
                    </div>

                    <div class="Log-out-button">
                        <div class="rect-66"></div>
                        <div class="rect-65"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const profileToggle = document.getElementById('profileToggle');
        const settingPopover = document.getElementById('settingPopover');

        // Toggle popover on click
        profileToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            settingPopover.classList.toggle('active');
        });

        // Close popover when clicking anywhere else
        document.addEventListener('click', (e) => {
            if (!settingPopover.contains(e.target) && !profileToggle.contains(e.target)) {
                settingPopover.classList.remove('active');
            }
        });
    </script>
</body>
</html>
