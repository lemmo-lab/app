<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Empty Wireframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            text-decoration: none;
        }

        body {
            background-color: #0A0A0A;
            font-family: Tahoma, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* فریم کلی برنامه */
        .app-container {
            position: relative;
            width: 1920px;
            max-width: 100%;
            height: 1080px;
            max-height: 100vh;
            background: #0A0A0A;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* ================= سایدبار سمت راست (Collapsed) ================= */
        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            width: 72px;
            height: 100%;
            background: #131517;
            order: 1;
            flex-shrink: 0;
        }

        .side .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 56px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .side .button .rectangle-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .primary-cats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px 0;
            width: 56px;
        }

        .primary-cats .button-gallery,
        .primary-cats .button-agent,
        .primary-cats .button-canvas,
        .primary-cats .button-assets,
        .tools-section .button-tools,
        .footer-sidebar .button-tutorials,
        .footer-sidebar .button-setting-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 60px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .primary-cats .button-gallery {
            background: #453D3D;
        }

        .primary-cats .icon,
        .tools-section .icon,
        .footer-sidebar .icon {
            width: 20px;
            height: 20px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .rectangle-9 {
            width: 40px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .footer-sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 16px 0;
            width: 56px;
            flex-grow: 1;
        }

        .footer-sidebar .button-setting-profile {
            height: 56px;
        }

        .footer-sidebar .button-setting-profile .rectangle-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        /* ================= پنل مدیریت ورک‌اسپیس (Workspace Side) ================= */
        .workspace-side {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 286px;
            height: 100%;
            background: #1D1D1D;
            order: 1;
            flex-shrink: 0;
        }

        .canvas-name-config {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 0 8px;
            gap: 10px;
            width: 100%;
            height: 64px;
        }

        .canvas-name-config .rectangle-20 {
            width: 107px;
            height: 16px;
            background: #D9D9D9;
            border-radius: 999px;
        }

        .workspace-items {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0;
            gap: 10px;
            width: 100%;
            flex-grow: 1;
        }

        .layer-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            width: 100%;
            height: 40px;
        }

        .layer-row .add-layer {
            width: 24px;
            height: 24px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .layer-row .rectangle-20 {
            width: 107px;
            height: 16px;
            background: #D9D9D9;
            border-radius: 999px;
        }

        .workspace-footer {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            height: 60px;
        }

        .credits {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px;
            gap: 8px;
            width: 100%;
            height: 60px;
        }

        .credits-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .credits-progress {
            width: 100%;
            height: 12px;
            background: #D9D9D9;
            border-radius: 999px;
        }

        /* ================= بوم اصلی (Canvas Area) ================= */
        .canvas-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            height: 100%;
            position: relative;
            background: #0A0A0A;
        }

        /* حالت خالی بوم (Hint Empty State) */
        .hint-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 327px;
        }

        .hint-empty-state .rect-22 {
            width: 251px;
            height: 14px;
            background: #525252;
            border-radius: 99px;
        }

        .hint-empty-state .rect-23 {
            width: 327px;
            height: 14px;
            background: #525252;
            border-radius: 99px;
        }

        /* ================= منوی شناور پایین (Nav Menu) ================= */
        .nav-menu {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 8px;
            gap: 10px;
            position: absolute;
            width: 412px;
            height: 64px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 42px;
            background: #555555;
            border-radius: 12px;
            z-index: 10;
        }

        .nav-menu .action {
            width: 48px;
            height: 48px;
            background: #D9D9D9;
            border-radius: 8px;
        }

        .nav-menu .action-switch {
            width: 106px;
            height: 48px;
            background: #D9D9D9;
            border-radius: 8px;
        }

        /* ================= سوییچ بالا (Team / Solo) ================= */
        .team-solo {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 8px;
            gap: 10px;
            position: absolute;
            width: 196px;
            height: 56px;
            left: 50%;
            transform: translateX(-50%);
            top: 42px;
            background: #525252;
            border-radius: 12px;
            z-index: 10;
        }

        .team-solo .rect-switch {
            width: 85px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 8px;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- سوییچ تیم / انفرادی بالا -->
        <div class="team-solo">
            <div class="rect-switch"></div>
            <div class="rect-switch"></div>
        </div>

        <!-- منوی شناور ابزارها پایین صفحه -->
        <div class="nav-menu">
            <div class="action"></div>
            <div class="action"></div>
            <div class="action"></div>
            <div class="action"></div>
            <div class="action"></div>
            <div class="action-switch"></div>
        </div>

        <!-- سایدبار سمت راست (آیکون‌ها) -->
        <aside class="side">
            <div class="button">
                <div class="rectangle-8"></div>
            </div>
            <div class="primary-cats">
                <div class="button-gallery">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
                <div class="button-agent">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
                <div class="button-canvas">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
                <div class="button-assets">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
            </div>
            <div class="tools-section">
                <div class="button-tools">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
            </div>
            <div class="footer-sidebar">
                <div class="button-tutorials">
                    <div class="icon"></div>
                    <div class="rectangle-9"></div>
                </div>
                <div class="button-setting-profile">
                    <div class="rectangle-8"></div>
                </div>
            </div>
        </aside>

        <!-- پنل ورک‌اسپیس و لایه‌ها -->
        <div class="workspace-side">
            <div class="canvas-name-config">
                <div class="rectangle-20"></div>
            </div>
            <div class="workspace-items">
                <div class="layer-row">
                    <div class="add-layer"></div>
                    <div class="rectangle-20"></div>
                </div>
                <div class="layer-row">
                    <div class="add-layer"></div>
                    <div class="rectangle-20"></div>
                </div>
                <div class="layer-row">
                    <div class="add-layer"></div>
                    <div class="rectangle-20"></div>
                </div>
                <div class="layer-row">
                    <div class="add-layer"></div>
                    <div class="rectangle-20"></div>
                </div>
            </div>
            <div class="workspace-footer">
                <div class="credits">
                    <div class="credits-top">
                        <div class="add-layer" style="width:24px; height:24px;"></div>
                        <div class="rectangle-20" style="width:107px;"></div>
                    </div>
                    <div class="credits-progress"></div>
                </div>
            </div>
        </div>

        <!-- بوم خالی مرکزی (Canvas Empty) -->
        <main class="canvas-area">
            <div class="hint-empty-state">
                <div class="rect-22"></div>
                <div class="rect-23"></div>
            </div>
        </main>

    </div>

</body>
</html>
