<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-image Wireframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Single-image / Main */
        .single-image {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0A0A0A;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            overflow: hidden;
        }

        /* body */
        .main-body {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 48px;
            gap: 48px;
            width: 1848px;
            height: 1080px;
            background: #0A0A0A;
            flex: none;
            order: 0;
            flex-grow: 1;
        }

        /* content */
        .content {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 48px;
            width: 1672px;
            height: 984px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 1;
        }

        /* little-gallery */
        .little-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0px;
            gap: 16px;
            width: 64px;
            height: 984px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
            overflow-y: auto;
        }

        .focus-pic {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 58px;
            height: 58px;
            flex: none;
            flex-grow: 0;
        }

        .rect-14 {
            width: 58px;
            height: 58px;
            background: #474747;
            border-radius: 8px;
            flex: none;
            flex-grow: 0;
        }

        .rect-14.active {
            background: #DEDEDE;
        }

        /* details-content */
        .details-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            gap: 16px;
            width: 450px;
            height: 984px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        /* promp */
        .promp {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            gap: 16px;
            width: 450px;
            height: 928px;
            flex: none;
            order: 0;
            flex-grow: 1;
        }

        /* top_section */
        .top_section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0px;
            gap: 151px;
            width: 450px;
            height: 18px;
        }

        .quick-action {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 44px;
            height: 18px;
        }

        .copy-button, .share-button {
            width: 18px;
            height: 18px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .top_section .lable {
            width: 89px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        /* promp_card */
        .promp_card {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px;
            gap: 10px;
            width: 450px;
            height: 206px;
            background: #272525;
            border-radius: 16px;
            flex: none;
            order: 1;
            flex-grow: 0;
        }

        .promp_card .text {
            width: 418px;
            height: 12px;
            background: #484848;
            border-radius: 99px;
            align-self: stretch;
        }

        .promp_card .text.short {
            width: 92px;
            align-self: flex-start;
        }

        /* tag */
        .tag-container {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 450px;
            height: 28px;
        }

        .tag-box {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 106px;
            height: 28px;
        }

        .tag_ {
            width: 106px;
            height: 28px;
            background: #464646;
            border-radius: 4px;
            flex-grow: 1;
        }

        /* refrance */
        .refrance {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            gap: 10px;
            width: 450px;
            height: 70px;
        }

        .refrance .lable-box {
            width: 65px;
            height: 12px;
            background: #424242;
            border-radius: 99px;
        }

        .refrances {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 450px;
            height: 48px;
        }

        .ref-item {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0px;
            gap: 10px;
            width: 48px;
            height: 48px;
        }

        .refrance-image {
            width: 48px;
            height: 48px;
            background: #464646;
            border-radius: 8px;
        }

        /* action_base */
        .action_base {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 9px;
            width: 450px;
            height: 40px;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .regreat-button {
            width: 450px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 999px;
            flex-grow: 1;
        }

        /* content-area */
        .content-area {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 1062px;
            height: 984px;
            background: #111111;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 1;
            position: relative;
        }

        .rect-17 {
            width: 449px;
            height: 754px;
            background: #D9D9D9;
            border-radius: 2px;
            margin: auto;
        }

        .back-button {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 32px;
            height: 32px;
        }

        .rect-11 {
            width: 32px;
            height: 32px;
            background: #D9D9D9;
            border-radius: 6px;
        }

        /* side (Sidebar) */
        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            width: 72px;
            height: 1080px;
            background: #131517;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .side .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 56px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .side .button .icon {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 40px;
            height: 40px;
        }

        .side .button .rect-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .primary-cats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 272px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 60px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .nav-button.active {
            background: #453D3D;
        }

        .nav-button .icon-small {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 20px;
            height: 20px;
        }

        .nav-button .rect-8-small {
            width: 20px;
            height: 20px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .nav-button .rect-9-indicator {
            width: 40px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .tools-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            width: 56px;
            height: 60px;
        }

        .footer-sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 676px;
            flex-grow: 1;
        }

        .footer-sidebar .nav-button {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="single-image">
        <!-- body -->
        <div class="main-body">
            <!-- content -->
            <div class="content">
                
                <!-- little-gallery -->
                <div class="little-gallery">
                    <div class="focus-pic"><div class="rect-14 active"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                    <div class="focus-pic"><div class="rect-14"></div></div>
                </div>

                <!-- details-content -->
                <div class="details-content">
                    <!-- promp -->
                    <div class="promp">
                        <div class="top_section">
                            <div class="quick-action">
                                <div class="copy-button"></div>
                                <div class="share-button"></div>
                            </div>
                            <div class="lable"></div>
                        </div>

                        <div class="promp_card">
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text"></div>
                            <div class="text short"></div>
                        </div>

                        <div class="tag-container">
                            <div class="tag-box"><div class="tag_"></div></div>
                            <div class="tag-box"><div class="tag_"></div></div>
                        </div>

                        <div class="refrance">
                            <div class="lable-box"></div>
                            <div class="refrances">
                                <div class="ref-item"><div class="refrance-image"></div></div>
                                <div class="ref-item"><div class="refrance-image"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- action_base -->
                    <div class="action_base">
                        <div class="regreat-button"></div>
                    </div>
                </div>

                <!-- content-area -->
                <div class="content-area">
                    <div class="back-button">
                        <div class="rect-11"></div>
                    </div>
                    <div class="rect-17"></div>
                </div>

            </div>
        </div>

        <!-- side (Sidebar) -->
        <div class="side">
            <div class="button">
                <div class="icon"><div class="rect-8"></div></div>
            </div>
            
            <div class="primary-cats">
                <div class="nav-button active">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="tools-section">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="footer-sidebar">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="button">
                    <div class="icon"><div class="rect-8"></div></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
