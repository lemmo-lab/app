<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets-empty Wireframe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Assets-empty / Main container */
        .assets-empty {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #0A0A0A;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            overflow: hidden;
        }

        /* main */
        .main {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            padding: 0px;
            position: absolute;
            width: 1920px;
            height: 1080px;
            left: 0px;
            top: 0px;
        }

        /* body */
        .body {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 48px;
            width: 1848px;
            height: 1080px;
            background: #0A0A0A;
            flex: none;
            order: 0;
            flex-grow: 1;
        }

        /* page-header */
        .page-header {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px 0px 60px;
            gap: 24px;
            width: 1752px;
            height: 154px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        /* action_section */
        .action_section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0px 0px 16px;
            gap: 268px;
            width: 1752px;
            height: 56px;
            flex: none;
            order: 0;
            align-self: stretch;
            flex-grow: 0;
        }

        .action {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 19px;
            width: 378px;
            height: 40px;
        }

        .search {
            width: 378px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 8px;
        }

        .tabs {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 13px;
            width: 459px;
            height: 40px;
        }

        .tab-item {
            width: 105px;
            height: 40px;
            background: #464646;
            border-radius: 8px;
        }

        .tab-item.active {
            background: #D9D9D9;
        }

        /* filter */
        .filter {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 1752px;
            height: 14px;
            align-self: stretch;
        }

        .filter-rect {
            width: 98px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .filter-line {
            width: 14px;
            height: 0px;
            border: 1px solid #FFFFFF;
        }

        /* content */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0px;
            width: 1752px;
            height: 830px;
            align-self: stretch;
            flex-grow: 1;
        }

        /* empty-state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0px;
            gap: 42px;
            width: 292px;
            height: 219px;
        }

        .empty-state-pic {
            width: 48px;
            height: 48px;
            background: #D9D9D9;
            border-radius: 8px;
        }

        .title-subtitle {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0px;
            gap: 15px;
            width: 292px;
            height: 47px;
            align-self: stretch;
        }

        .rect-42 {
            width: 130px;
            height: 18px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .rect-41 {
            width: 292px;
            height: 14px;
            background: #535353;
            border-radius: 99px;
            align-self: stretch;
        }

        .button-add {
            width: 186px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 8px;
        }

        /* side (Sidebar) */
        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            width: 72px;
            height: 1080px;
            background: #131517;
            flex: none;
            order: 1;
            align-self: stretch;
            flex-grow: 0;
        }

        .side .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 56px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .side .button .icon {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 40px;
            height: 40px;
        }

        .side .button .rect-8 {
            width: 40px;
            height: 40px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .primary-cats {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 272px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 10px;
            width: 56px;
            height: 60px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .nav-button.active {
            background: #453D3D;
        }

        .nav-button .icon-small {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 10px;
            width: 20px;
            height: 20px;
        }

        .nav-button .rect-8-small {
            width: 20px;
            height: 20px;
            background: #D9D9D9;
            border-radius: 4px;
        }

        .nav-button .rect-9-indicator {
            width: 40px;
            height: 14px;
            background: #D9D9D9;
            border-radius: 99px;
        }

        .tools-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 0px;
            width: 56px;
            height: 60px;
        }

        .footer-sidebar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 16px 0px;
            width: 56px;
            height: 676px;
            flex-grow: 1;
        }

        .footer-sidebar .nav-button {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="assets-empty">
        <div class="main">
            <!-- body -->
            <div class="body">
                
                <!-- page-header -->
                <div class="page-header">
                    <div class="action_section">
                        <div class="action">
                            <div class="search"></div>
                        </div>
                        <div class="tabs">
                            <div class="tab-item"></div>
                            <div class="tab-item"></div>
                            <div class="tab-item"></div>
                            <div class="tab-item active"></div>
                        </div>
                    </div>
                    
                    <div class="filter">
                        <div class="filter-rect"></div>
                        <div class="filter-line"></div>
                        <div class="filter-rect"></div>
                        <div class="filter-line"></div>
                        <div class="filter-rect"></div>
                    </div>
                </div>

                <!-- content -->
                <div class="content">
                    <div class="empty-state">
                        <div class="empty-state-pic"></div>
                        <div class="title-subtitle">
                            <div class="rect-42"></div>
                            <div class="rect-41"></div>
                        </div>
                        <div class="button-add"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- side (Sidebar) -->
        <div class="side">
            <div class="button">
                <div class="icon"><div class="rect-8"></div></div>
            </div>
            
            <div class="primary-cats">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="nav-button active">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="tools-section">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
            </div>

            <div class="footer-sidebar">
                <div class="nav-button">
                    <div class="icon-small"><div class="rect-8-small"></div></div>
                    <div class="rect-9-indicator"></div>
                </div>
                <div class="button">
                    <div class="icon"><div class="rect-8"></div></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
