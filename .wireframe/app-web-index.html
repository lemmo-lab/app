<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8" />
<title>Lemu — Gallery Wireframe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0A0A0A;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    width: 100%;
    overflow-x: auto;
  }

  .app {
    position: relative;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 1920px;
    min-height: 1080px;
    background: #0A0A0A;
    margin: 0 auto;
  }

  /* ===== BODY (main content) ===== */
  .body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 48px;
    width: 1848px;
    background: #0A0A0A;
    flex: 1 0 0;
    gap: 0;
  }

  .placeholder {
    background: #D9D9D9;
  }

  /* ---- Banner ---- */
  .banner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 0 0 60px 0;
    gap: 24px;
    width: 100%;
  }

  .slider {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
  }

  .slider-image {
    width: 100%;
    height: 400px;
    border-radius: 32px;
  }

  .footer-section {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 32px;
  }

  .pagination {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    width: 72px;
    height: 32px;
  }

  .pagination .arrow {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }

  .label {
    width: 203px;
    height: 18px;
    border-radius: 99px;
  }

  /* ---- Tools section ---- */
  .tools-section {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 0 0 60px 0;
    gap: 24px;
    width: 100%;
  }

  .tools-card {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
    flex: 1 1 0;
  }

  .tools-card-img {
    width: 100%;
    height: 167px;
    border-radius: 18px;
  }

  .tools-card-label {
    width: 167px;
    height: 16px;
    border-radius: 99px;
  }

  /* ---- Gallery ---- */
  .gallery {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 32px;
    width: 100%;
  }

  .header-page {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 68px;
    width: 100%;
    height: 40px;
  }

  .publish-button {
    width: 126px;
    height: 40px;
    border-radius: 8px;
  }

  .action-page {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 44px;
    height: 40px;
  }

  .search-bar {
    width: 515px;
    height: 40px;
    border-radius: 8px;
  }

  .divider {
    width: 40px;
    height: 0;
    border: 1px solid #FFFFFF;
    transform: rotate(90deg);
  }

  .tab {
    width: 227px;
    height: 40px;
    border-radius: 8px;
  }

  .masonry-grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: flex-start;
    align-content: flex-start;
    gap: 8px;
    width: 100%;
    border-radius: 32px;
  }

  .gallery-card {
    width: 344px;
    height: 560px;
    background: #D9D9D9;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
    width: 72px;
    height: 1080px;
    background: #131517;
    flex: none;
  }

  .side-logo-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    width: 56px;
    height: 56px;
    background: #171717;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .side-logo-btn .icon {
    width: 40px;
    height: 40px;
    border-radius: 4px;
  }

  .primary-cats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding: 16px 0;
    width: 56px;
    gap: 0;
  }

  .side-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    gap: 10px;
    width: 56px;
    height: 60px;
    background: #171717;
    border-radius: 8px;
  }

  .side-btn.active {
    background: #453D3D;
  }

  .side-btn .icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
  }

  .side-btn .icon-lg {
    width: 40px;
    height: 40px;
    border-radius: 4px;
  }

  .side-btn .lbl {
    width: 40px;
    height: 14px;
    border-radius: 99px;
  }

  .side-section {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    width: 56px;
  }

  .footer-sidebar {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 16px 0;
    width: 56px;
    flex: 1 0 0;
    gap: 0;
  }

  .side-btn.no-bg {
    background: transparent;
  }
</style>
</head>
<body>

<div class="app">

  <!-- MAIN BODY -->
  <div class="body">

    <!-- Banner -->
    <section class="banner">
      <div class="slider">
        <div class="placeholder slider-image"></div>
      </div>
      <div class="footer-section">
        <div class="pagination">
          <div class="placeholder arrow"></div>
          <div class="placeholder arrow"></div>
        </div>
        <div class="label">
          <div class="placeholder label" style="width:203px;height:18px;"></div>
        </div>
      </div>
    </section>

    <!-- Tools -->
    <section class="tools-section">
      <div class="tools-card">
        <div class="placeholder tools-card-img"></div>
        <div class="placeholder tools-card-label"></div>
      </div>
      <div class="tools-card">
        <div class="placeholder tools-card-img"></div>
        <div class="placeholder tools-card-label"></div>
      </div>
      <div class="tools-card">
        <div class="placeholder tools-card-img"></div>
        <div class="placeholder tools-card-label"></div>
      </div>
      <div class="tools-card">
        <div class="placeholder tools-card-img"></div>
        <div class="placeholder tools-card-label"></div>
      </div>
    </section>

    <!-- Gallery -->
    <section class="gallery">
      <div class="header-page">
        <div class="button">
          <div class="placeholder publish-button"></div>
        </div>
        <div class="action-page">
          <div class="search-bar">
            <div class="placeholder search-bar" style="width:515px;height:40px;"></div>
          </div>
          <div class="divider"></div>
          <div class="tab">
            <div class="placeholder tab" style="width:227px;height:40px;"></div>
          </div>
        </div>
      </div>

      <div class="masonry-grid">
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
        <div class="gallery-card"></div>
      </div>
    </section>

  </div>

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="side-logo-btn">
      <div class="placeholder icon"></div>
    </div>

    <div class="primary-cats">
      <div class="side-btn active">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
      <div class="side-btn">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
      <div class="side-btn">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
      <div class="side-btn">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-btn">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
    </div>

    <div class="footer-sidebar">
      <div class="side-btn no-bg">
        <div class="placeholder icon"></div>
        <div class="placeholder lbl"></div>
      </div>
      <div class="side-logo-btn">
        <div class="placeholder icon-lg"></div>
      </div>
    </div>
  </nav>

</div>

</body>
</html>
